<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدولي — نظام التنظيم الاحترافي</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --hour-height: 64px;
    --bg:#060911;
    --surface:#0d1321;
    --surface-2:#131a2c;
    --surface-3:#1a2238;
    --border:rgba(148,163,184,0.10);
    --border-strong:rgba(148,163,184,0.20);
    --text:#e8edf5;
    --text-muted:#8b95a8;
    --primary:#6366f1;
    --primary-light:#818cf8;
    --success:#10b981;
    --warning:#f59e0b;
    --danger:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,0.15), transparent),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(139,92,246,0.08), transparent);
    background-attachment:fixed;
    font-size:15px;
  }
  .font-time{font-family:'JetBrains Mono',monospace;direction:ltr;font-weight:700;letter-spacing:.02em}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.22);border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,0.4)}

  .glass{background:rgba(19,26,44,0.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border)}
  .glass.sleep{background:rgba(76,29,149,0.18);border-color:rgba(167,139,250,0.35);box-shadow:0 0 32px -8px rgba(139,92,246,0.35)}
  .card-surface{background:var(--surface);border:1px solid var(--border)}

  .session-card{transition:transform .18s cubic-bezier(.4,0,.2,1), box-shadow .18s, filter .18s;cursor:pointer}
  .session-card:hover{transform:translateY(-2px) scale(1.012);z-index:25;box-shadow:0 12px 32px -8px rgba(0,0,0,0.65);filter:brightness(1.1)}
  .session-card.is-now{animation:nowPulse 2.4s ease-in-out infinite}
  @keyframes nowPulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.5), 0 8px 24px -4px rgba(0,0,0,0.5)}50%{box-shadow:0 0 0 7px rgba(16,185,129,0), 0 8px 24px -4px rgba(0,0,0,0.5)}}

  .fade-in{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .modal-enter{animation:modalIn .22s cubic-bezier(.4,0,.2,1)}
  @keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
  .toast-enter{animation:toastIn .3s cubic-bezier(.4,0,.2,1)}
  @keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;transition:all .15s;border:none;font-family:inherit}
  .btn:active{transform:scale(.96)}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 16px -4px rgba(99,102,241,.5)}
  .btn-primary:hover{box-shadow:0 6px 20px -4px rgba(99,102,241,.7);filter:brightness(1.08)}
  .btn-ghost{background:rgba(148,163,184,.08);color:var(--text);border:1px solid var(--border-strong)}
  .btn-ghost:hover{background:rgba(148,163,184,.15)}
  .btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 16px -4px rgba(16,185,129,.5)}
  .btn-success:hover{filter:brightness(1.08)}
  .btn-danger{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
  .btn-danger:hover{background:rgba(239,68,68,.2)}

  .note-textarea{width:100%;background:rgba(6,9,17,.6);border:1.5px solid var(--border-strong);border-radius:14px;padding:14px 16px;font-family:'Cairo',sans-serif;font-size:15px;color:var(--text);resize:vertical;min-height:120px;transition:border-color .15s, box-shadow .15s;outline:none;line-height:1.8}
  .note-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.15)}
  .note-textarea::placeholder{color:var(--text-muted)}

  .note-display{background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(139,92,246,.05));border:1px solid rgba(99,102,241,.25);border-radius:14px;padding:16px 18px;line-height:1.85;font-size:15px;color:#dbe4f0;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow-y:auto}
  .note-display.empty{background:rgba(148,163,184,.03);border:1.5px dashed rgba(148,163,184,.2);color:var(--text-muted);text-align:center;padding:28px 16px;font-style:italic;font-size:14px}

  .day-chip{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;transition:all .15s;border:1.5px solid transparent;width:100%;text-align:right;font-family:inherit;color:var(--text);background:rgba(148,163,184,.04)}
  .day-chip:hover{background:rgba(148,163,184,.09);border-color:var(--border-strong)}
  .day-chip.active{background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(139,92,246,.15));border-color:rgba(99,102,241,.5);box-shadow:0 4px 20px -6px rgba(99,102,241,.5), inset 0 1px 0 rgba(255,255,255,.08)}

  .theme-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap}

  .stat-pill{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:800;background:rgba(148,163,184,.06);border:1px solid var(--border);color:#b8c2d4}

  .time-label{display:inline-block;padding:3px 10px;border-radius:9px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;background:linear-gradient(135deg,rgba(19,26,44,.98),rgba(13,19,33,.98));color:#e2e8f0;border:1.5px solid rgba(148,163,184,.28);box-shadow:0 2px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);letter-spacing:.03em;direction:ltr}

  .notif-btn.enabled{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.4);cursor:default}

  .sleep-moon{animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

  /* ===== Week Grid ===== */
  .week-grid{display:grid;grid-template-columns:80px repeat(7,1fr)}
  .week-head-cell{padding:10px 6px;text-align:center;font-size:12px;font-weight:800;border-left:1px solid var(--border);position:relative;background:rgba(99,102,241,.06)}
  .week-head-cell:last-child{border-left:none}
  .week-head-cell.today{background:rgba(99,102,241,.18)}
  .week-head-cell .date{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-muted);margin-top:3px}
  .week-time-cell{position:relative;border-left:1px solid var(--border);background:rgba(6,9,17,.5)}
  .week-col{position:relative;border-left:1px solid var(--border)}
  .week-col:last-child{border-left:none}
  .week-col.today{background:rgba(99,102,241,.05)}
  .week-session{position:absolute;left:3px;right:3px;border-radius:5px;padding:3px 5px;overflow:hidden;cursor:pointer;color:#fff;text-align:right;font-family:inherit;border:none;transition:transform .15s, box-shadow .15s, filter .15s;display:flex;align-items:center;gap:4px}
  .week-session:hover{transform:scale(1.04);z-index:10;box-shadow:0 8px 20px -6px rgba(0,0,0,.7);filter:brightness(1.15)}
  .week-session-title{font-size:9.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;flex-grow:1}
  .week-session-time{font-family:'JetBrains Mono',monospace;font-size:8px;direction:ltr;opacity:.8;white-space:nowrap}

  /* ===== Edit view grid ===== */
  .edit-grid-wrapper{position:relative;display:flex;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:rgba(13,19,33,.4)}
  .edit-time-axis{width:70px;flex:0 0 70px;position:relative;user-select:none;background:rgba(6,9,17,.5);border-left:1px solid var(--border)}
  .edit-time-axis .mark{position:absolute;width:100%;display:flex;justify-content:center;transform:translateY(-50%);z-index:2}
  .edit-canvas{flex:1;position:relative;background:rgba(13,19,33,.4);touch-action:none}

  .edit-session{position:absolute;left:6px;right:6px;border-radius:10px;padding:6px 10px;color:#fff;cursor:grab;user-select:none;overflow:hidden;transition:box-shadow .15s, filter .15s;box-shadow:0 3px 12px -4px rgba(0,0,0,.5);touch-action:none}
  .edit-session:hover{box-shadow:0 6px 20px -6px rgba(0,0,0,.7);filter:brightness(1.1)}
  .edit-session.dragging{cursor:grabbing;z-index:50;box-shadow:0 18px 40px -10px rgba(0,0,0,.9);filter:brightness(1.15);transform:scale(1.02)}
  .edit-session.resizing{z-index:50;box-shadow:0 12px 30px -8px rgba(0,0,0,.8)}
  .edit-session .handle-resize{position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize;display:flex;justify-content:center;align-items:flex-end;padding-bottom:2px}
  .edit-session .handle-resize::after{content:'';display:block;width:30px;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
  .edit-session .sess-delete{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:5px;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s}
  .edit-session:hover .sess-delete{opacity:1}
  .edit-session .sess-delete:hover{background:rgba(239,68,68,.7)}
  .edit-session .sess-title{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25;padding-left:22px}
  .edit-session .sess-time{font-family:'JetBrains Mono',monospace;font-size:9.5px;margin-top:2px;direction:ltr;opacity:.85}
  .edit-session .sess-icon{display:inline-flex;vertical-align:middle;margin-left:3px}
  .edit-session .sess-icon svg{width:13px;height:13px}

  .snap-line{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(99,102,241,.8);z-index:40;pointer-events:none;display:none}
  .snap-line.show{display:block}
  .drag-hint{position:absolute;top:6px;right:8px;padding:4px 9px;border-radius:7px;background:rgba(16,185,129,.92);color:#fff;font-size:11px;font-weight:800;z-index:45;pointer-events:none;display:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .drag-hint.show{display:block}

  .form-input{width:100%;min-width:0;padding:8px 10px;border-radius:10px;background:rgba(6,9,17,.6);border:1.5px solid var(--border-strong);color:var(--text);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
  .form-input:focus{border-color:var(--primary)}
  .scope-btn{padding:9px 18px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;background:rgba(148,163,184,.06);border:1.5px solid var(--border-strong);color:#b8c2d4;transition:all .15s;font-family:inherit}
  .scope-btn.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;color:#fff;box-shadow:0 4px 16px -4px rgba(99,102,241,.5)}
  .day-tab{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:800;cursor:pointer;background:rgba(148,163,184,.06);border:1.5px solid var(--border-strong);color:#b8c2d4;transition:all .15s;font-family:inherit}
  .day-tab.active{background:rgba(99,102,241,.25);border-color:rgba(99,102,241,.5);color:#fff}

  @media print{
    @page{size:A4 landscape;margin:5mm}
    body{background:#fff!important;color:#0f172a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .no-print{display:none!important}
    .print-area{overflow:visible!important;box-shadow:none!important;border:1px solid #94a3b8!important;background:#fff!important}
  }
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-40 no-print" style="background:rgba(6,9,17,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)">
  <div class="max-w-[1720px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 8px 24px -6px rgba(99,102,241,.6)">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2.5"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div>
        <h1 class="text-xl font-black text-white leading-tight">جدولي</h1>
        <p class="text-[12px] font-semibold" style="color:var(--text-muted)">نظام تنظيم احترافي</p>
      </div>
    </div>

    <div id="now-widget" class="flex items-center gap-4 px-5 py-2.5 rounded-2xl glass min-w-[380px] transition-all duration-500">
      <div class="text-center pl-4" style="border-left:1px solid var(--border)">
        <div id="live-clock" class="font-time text-2xl text-indigo-300 tracking-tight">--:--:--</div>
        <div id="live-date" class="text-[12px] font-semibold mt-0.5" style="color:var(--text-muted)">—</div>
      </div>
      <div class="flex-grow min-w-0">
        <div class="flex items-center gap-1.5 mb-1">
          <span id="now-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="now-label" class="text-[11px] font-black uppercase tracking-wider" style="color:var(--text-muted)">الآن</span>
        </div>
        <div id="now-activity" class="text-base font-extrabold text-emerald-300 truncate">—</div>
        <div id="now-remaining" class="text-[12px] font-time mt-0.5" style="color:var(--text-muted)">—</div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="btn-sound" class="btn btn-ghost" title="تفعيل/إيقاف الأصوات">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <span class="hidden sm:inline" id="sound-label">الأصوات</span>
      </button>
      <button id="btn-enable-notif" class="btn notif-btn" style="background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.35)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="hidden sm:inline">الإشعارات</span>
      </button>
      <button onclick="window.print()" class="btn btn-primary">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span class="hidden sm:inline">طباعة</span>
      </button>
    </div>
  </div>

  <div class="max-w-[1720px] mx-auto px-4 sm:px-6 pb-3 flex flex-wrap items-center gap-2">
    <button class="view-tab btn btn-ghost active" data-view="day">اليوم</button>
    <button class="view-tab btn btn-ghost" data-view="week">الأسبوع</button>
    <button class="view-tab btn btn-ghost" data-view="edit">تعديل الجدول</button>
    <div id="now-badge" class="ml-auto text-[12px] font-bold px-3 py-1.5 rounded-lg" style="background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)">جاهز</div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<div class="flex-grow w-full max-w-[1720px] mx-auto flex gap-5 p-3 sm:p-4 no-print">

  <!-- SIDEBAR -->
  <aside class="w-72 shrink-0 hidden md:flex flex-col gap-3">
    <div class="rounded-2xl card-surface p-3 shadow-xl">
      <div class="text-[11px] font-black uppercase tracking-widest px-2 mb-2" style="color:var(--text-muted)">أيام الأسبوع</div>
      <nav id="days-nav" class="flex flex-col gap-1.5"></nav>
    </div>

    <div class="rounded-2xl card-surface overflow-hidden shadow-xl">
      <div class="px-4 py-2.5 flex items-center justify-between" style="border-bottom:1px solid var(--border);background:rgba(99,102,241,.06)">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span class="text-sm font-extrabold text-white">ملاحظة اليوم</span>
        </div>
        <button id="day-note-edit-btn" class="w-8 h-8 rounded-lg flex items-center justify-center transition hover:bg-white/10" style="color:var(--text-muted)" title="تعديل">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>
      <div class="p-3">
        <div id="day-note-view">
          <div id="day-note-display" class="note-display empty" style="min-height:auto;padding:14px;font-size:13px">لا توجد ملاحظة لهذا اليوم</div>
          <button id="day-note-add-btn" class="btn btn-ghost w-full mt-2" style="font-size:13px;padding:8px">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            إضافة ملاحظة
          </button>
        </div>
        <div id="day-note-edit" class="hidden">
          <textarea id="day-note-textarea" class="note-textarea" style="min-height:100px;font-size:13px" placeholder="اكتب ملاحظتك..."></textarea>
          <div class="flex gap-2 mt-2">
            <button id="day-note-save" class="btn btn-success flex-grow" style="padding:8px;font-size:13px">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              حفظ
            </button>
            <button id="day-note-cancel" class="btn btn-ghost" style="padding:8px 12px;font-size:13px">إلغاء</button>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- CONTENT -->
  <main class="flex-grow min-w-0">

    <div class="md:hidden mb-3">
      <select id="mobile-day-select" class="w-full px-4 py-2.5 rounded-xl font-bold text-base outline-none" style="background:var(--surface-2);border:1.5px solid var(--border-strong);color:var(--text)"></select>
    </div>

    <!-- DAY VIEW -->
    <section id="view-day" class="fade-in">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-3">
        <div class="flex items-center gap-3">
          <div class="w-2 h-10 rounded-full" style="background:linear-gradient(180deg,#6366f1,#8b5cf6)"></div>
          <div>
            <h2 id="day-title" class="text-2xl font-black text-white">—</h2>
            <p id="day-subtitle" class="text-sm font-semibold mt-0.5" style="color:var(--text-muted)">—</p>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <div class="stat-pill">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="day-count">—</span>
          </div>
          <div class="stat-pill">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span id="day-hours">—</span>
          </div>
        </div>
      </div>

      <div class="print-area rounded-2xl overflow-x-auto shadow-2xl card-surface">
        <div class="min-w-[900px] flex">

const timeToMinutes = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const minutesToTime = m => { m = Math.max(0, Math.min(1439, Math.round(m))); return pad(Math.floor(m/60)) + ':' + pad(m%60); };
const dateToDayIdx = d => (d.getDay()+6)%7;
const todayIndex = () => dateToDayIdx(new Date());
const startOfDay = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays = (d,n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const getWeekStart = d => { const r = startOfDay(d); r.setDate(r.getDate()-dateToDayIdx(r)); return r; };
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const formatDate = (d,o) => d.toLocaleDateString('ar-EG',o);
const getWeekKey = d => {
  const dd = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const wd = dd.getUTCDay()||7;
  dd.setUTCDate(dd.getUTCDate()+4-wd);
  const ys = new Date(Date.UTC(dd.getUTCFullYear(),0,1));
  const w = Math.ceil((((dd-ys)/86400000)+1)/7);
  return dd.getUTCFullYear()+"-W"+pad(w);
};
const isSchoolSession = s => s && (s.theme === 'school' || (s.title && s.title.trim() === 'مدرسة'));

/* =========================================================
   STORE
   ========================================================= */
const STORE_KEY = 'schedule_pro_v4';
function loadStore(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    return {
      notes: raw?.notes || {},
      dayNotes: raw?.dayNotes || {},
      schedule: raw?.schedule || clone(DEFAULT_SCHEDULE),
      overrides: raw?.overrides || {}
    };
  }catch(e){
    return { notes:{}, dayNotes:{}, schedule: clone(DEFAULT_SCHEDULE), overrides:{} };
  }
}
let STORE = loadStore();
function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); }

function getSessionsFor(date){
  const weekKey = getWeekKey(date);
  const idx = dateToDayIdx(date);
  const ovr = STORE.overrides[weekKey]?.[idx];
  return Array.isArray(ovr) ? ovr : STORE.schedule[idx].sessions;
}

/* =========================================================
   AUDIO
   ========================================================= */
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playStartSound(){
  if (!soundEnabled) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const now = ctx.currentTime;
  [523.25, 659.25, 783.99].forEach((freq, i) => {
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now + i*0.12);
    gain.gain.linearRampToValueAtTime(0.18, now + i*0.12 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.12 + 0.35);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now + i*0.12); osc.stop(now + i*0.12 + 0.4);
  });
}
function playEndSound(){
  if (!soundEnabled) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const now = ctx.currentTime;
  [783.99, 659.25, 523.25].forEach((freq, i) => {
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now + i*0.15);
    gain.gain.linearRampToValueAtTime(0.18, now + i*0.15 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.15 + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now + i*0.15); osc.stop(now + i*0.15 + 0.45);
  });
}

function toast(msg, type='success'){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  const colors = {
    success:'background:linear-gradient(135deg,#10b981,#059669);color:#fff',
    info:'background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff',
    danger:'background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff'
  };
  t.className='toast-enter px-6 py-3.5 rounded-xl font-bold text-sm shadow-2xl';
  t.style.cssText = colors[type] + ';box-shadow:0 10px 40px -10px rgba(0,0,0,.6)';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2200);
}

/* =========================================================
   DAY VIEW
   ========================================================= */
function renderDay(){
  const date = addDays(getWeekStart(new Date()), activeDay);
  const sessions = getSessionsFor(date);
  const day = STORE.schedule[activeDay];

  document.getElementById('day-title').textContent = day.day;
  document.getElementById('day-subtitle').textContent = formatDate(date, {day:'numeric', month:'long', year:'numeric'});
  document.getElementById('day-count').textContent = sessions.length + ' نشاط';

  let totalMin = 0;
  sessions.forEach(s=>{ if (!isSchoolSession(s)) totalMin += (timeToMinutes(s.end) - timeToMinutes(s.start)); });
  const h = Math.floor(totalMin/60), m = totalMin%60;
  document.getElementById('day-hours').textContent = `${h}س ${m>0?m+'د':''}`.trim();

  const timeAxis = document.getElementById('time-axis');
  const dayGrid = document.getElementById('day-grid');
  timeAxis.innerHTML = '';
  dayGrid.innerHTML = '';
  timeAxis.style.height = TOTAL_HEIGHT+'px';
  dayGrid.style.height = TOTAL_HEIGHT+'px';

  for(let hour=5; hour<=21; hour++){
    const topPx = (hour-START_HOUR)*HOUR_HEIGHT;
    const marker = document.createElement('div');
    marker.className='absolute w-full flex items-center justify-center -translate-y-1/2 z-10';
    marker.style.top = topPx+'px';
    marker.innerHTML = `<span class="time-label">${pad(hour)}:00</span>`;
    timeAxis.appendChild(marker);

    const line = document.createElement('div');
    line.className='absolute inset-x-0 pointer-events-none';
    line.style.cssText = `top:${topPx}px;border-top:1px solid rgba(148,163,184,.09)`;
    dayGrid.appendChild(line);
  }

  const origin = START_HOUR*60;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  const isToday = activeDay === todayIndex();

  sessions.forEach((s, idx)=>{
    const sMin = timeToMinutes(s.start), eMin = timeToMinutes(s.end);
    const dur = eMin - sMin;
    const topPx = ((sMin-origin)/60)*HOUR_HEIGHT;
    const hPx = Math.max((dur/60)*HOUR_HEIGHT - 4, 26);
    const isNow = isToday && nowMin>=sMin && nowMin<eMin;
    const isPast = isToday && nowMin>=eMin;
    const theme = THEMES[s.theme];
    const noteKey = `${activeDay}-${idx}`;
    const hasNote = !!STORE.notes[noteKey];

    const card = document.createElement('div');
    card.style.top = (topPx+2)+'px';
    card.style.height = hPx+'px';
    card.style.background = theme.bg;
    card.style.border = `1.5px solid ${theme.border}`;
    card.style.borderRight = `5px solid ${theme.border}`;
    card.style.opacity = isPast ? '0.55' : '1';
    card.className = 'session-card absolute inset-x-2.5 rounded-lg px-3 flex flex-col justify-center shadow-lg z-10' + (isNow?' is-now':'');

    const timeBadge = `<span class="theme-badge" style="background:${theme.badge};color:${theme.badgeText}">${s.start} - ${s.end}</span>`;

    if(dur<=30){
      card.style.padding = '4px 10px';
      card.innerHTML = `<div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 min-w-0">
          <span style="color:${theme.border}">${ICONS[s.icon]}</span>
          <span class="text-[12px] font-extrabold text-white truncate">${s.title}</span>
          ${hasNote?'<span style="color:#fbbf24">•</span>':''}
        </div>${timeBadge}</div>`;
    } else {
      card.innerHTML = `<div class="flex items-center justify-center gap-2 w-full">
        <span style="color:${theme.border}">${ICONS[s.icon]}</span>
        <span class="text-[13.5px] font-extrabold text-white leading-tight truncate">${s.title}</span>
        ${hasNote?'<span style="color:#fbbf24">•</span>':''}
      </div>
      <div class="text-center mt-1.5">${timeBadge}</div>`;
    }
    card.onclick = ()=> openNoteModal(activeDay, idx, s);
    dayGrid.appendChild(card);
  });

  if(isToday && nowMin>=START_HOUR*60 && nowMin<=END_HOUR*60){
    const top = ((nowMin-origin)/60)*HOUR_HEIGHT;
    const line = document.createElement('div');
    line.className='absolute inset-x-0 z-30 pointer-events-none';
    line.style.top = top+'px';
    line.innerHTML = `<div class="relative">
      <div style="height:2.5px;background:linear-gradient(90deg,transparent,#f43f5e,#f43f5e,transparent);box-shadow:0 0 14px rgba(244,63,94,.75)"></div>
      <div class="absolute -top-2 right-0 w-4 h-4 rounded-full" style="background:#f43f5e;box-shadow:0 0 14px rgba(244,63,94,.9)"></div>
    </div>`;
    dayGrid.appendChild(line);
  }
  renderDayNote();
}

function renderDayNote(){
  const txt = STORE.dayNotes[activeDay] || '';
  const display = document.getElementById('day-note-display');
  const addBtn = document.getElementById('day-note-add-btn');
  const editBtn = document.getElementById('day-note-edit-btn');
  const viewBox = document.getElementById('day-note-view');
  const editBox = document.getElementById('day-note-edit');

  if(dayNoteEditing){
    viewBox.classList.add('hidden');
    editBox.classList.remove('hidden');
    document.getElementById('day-note-textarea').value = txt;
    setTimeout(()=>document.getElementById('day-note-textarea').focus(),30);
    editBtn.classList.add('hidden');
    return;
  }
  viewBox.classList.remove('hidden');
  editBox.classList.add('hidden');
  editBtn.classList.remove('hidden');
  if(txt){
    display.textContent = txt;
    display.classList.remove('empty');
    addBtn.classList.add('hidden');
  } else {
    display.textContent = 'لا توجد ملاحظة لهذا اليوم';
    display.classList.add('empty');
    addBtn.classList.remove('hidden');
  }
}
function startDayNoteEdit(){ dayNoteEditing = true; renderDayNote(); }
function saveDayNote(){
  const val = document.getElementById('day-note-textarea').value.trim();
  if(val) STORE.dayNotes[activeDay] = val;
  else delete STORE.dayNotes[activeDay];
  saveStore(); dayNoteEditing = false; renderDayNote();
  toast('تم حفظ ملاحظة اليوم');
}
function cancelDayNote(){ dayNoteEditing = false; renderDayNote(); }

/* =========================================================
   NOW — مع كشف بداية/نهاية النشاط وتشغيل الصوت
   ========================================================= */
function updateNow(){
  const now = new Date();
  document.getElementById('live-clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('live-date').textContent = formatDate(now, {weekday:'long',day:'numeric',month:'long'});

  const nowAct = document.getElementById('now-activity');
  const nowRem = document.getElementById('now-remaining');
  const nowLabel = document.getElementById('now-label');
  const dot = document.getElementById('now-dot');
  const widget = document.getElementById('now-widget');
  const badge = document.getElementById('now-badge');

  const minNow = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  const ti = todayIndex();
  const sessions = getSessionsFor(now);

  const isSleeping = (minNow >= SLEEP_START_MIN) || (minNow < SLEEP_END_MIN);

  if(isSleeping){
    let remMin = minNow >= SLEEP_START_MIN ? (1440 - minNow) + SLEEP_END_MIN : SLEEP_END_MIN - minNow;
    const h = Math.floor(remMin/60), m = Math.floor(remMin%60);
    nowAct.textContent = 'وقت النوم';
    nowAct.style.color = '#c4b5fd';
    nowRem.textContent = `متبقي ${h>0?h+'س ':''}${m}د حتى الاستيقاظ`;
    nowRem.style.color = '#a78bfa';
    nowLabel.textContent = 'وضع الراحة';
    nowLabel.style.color = '#a78bfa';
    dot.style.background = '#a78bfa';
    dot.classList.remove('animate-pulse');
    widget.classList.add('sleep');
    badge.textContent = 'راحة';
    badge.style.cssText = 'background:rgba(167,139,250,.15);color:#c4b5fd;border:1px solid rgba(167,139,250,.35)';
    if(!wasSleeping){ wasSleeping = true; toast('موعد النوم — تصبح على خير', 'info'); }
    lastActivityKey = null;
    return;
  }

  if(wasSleeping){
    wasSleeping = false;
    widget.classList.remove('sleep');
    toast('صباح الخير — بدأ وقت الأنشطة', 'success');
  }
  nowLabel.textContent = 'الآن';
  nowLabel.style.color = 'var(--text-muted)';

  const current = sessions.find(s=>{
    const sM = timeToMinutes(s.start), eM = timeToMinutes(s.end);
    return minNow >= sM && minNow < eM;
  });

  let currentKey = null;
  if(current){
    const idx = sessions.indexOf(current);
    currentKey = `${ti}-${idx}-${now.toDateString()}`;
    if(lastActivityKey !== currentKey){
      if(lastActivityKey !== null){
        playStartSound();
        toast(`بدأ: ${current.title}`, 'success');
      }
      lastActivityKey = currentKey;
    }
  } else {
    if(lastActivityKey !== null){
      playEndSound();
      toast('انتهى النشاط', 'info');
      lastActivityKey = null;
    }
  }

  if(current){
    const eM = timeToMinutes(current.end);
    const rem = Math.max(0, eM - minNow);
    const h = Math.floor(rem/60), m = Math.floor(rem%60);
    nowAct.textContent = current.title;
    nowAct.style.color = '#6ee7b7';
    nowRem.textContent = `متبقي ${h>0?h+'س ':''}${m}د`;
    nowRem.style.color = '#6ee7b7';
    dot.style.background = '#6ee7b7';
    dot.classList.add('animate-pulse');
    badge.textContent = 'جارٍ الآن';
    badge.style.cssText = 'background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.35)';
  } else {
    const next = sessions.find(s=>timeToMinutes(s.start)>minNow);
    if(next){
      const sM = timeToMinutes(next.start);
      const rem = sM - minNow;
      const h = Math.floor(rem/60), m = Math.floor(rem%60);
      nowAct.textContent = `التالي: ${next.title}`;
      nowAct.style.color = '#fcd34d';
      nowRem.textContent = `بعد ${h>0?h+'س ':''}${m}د`;
      nowRem.style.color = '#fcd34d';
      dot.style.background = '#fcd34d';
      dot.classList.remove('animate-pulse');
      badge.textContent = 'قادم';
      badge.style.cssText = 'background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.35)';
    } else {
      nowAct.textContent = 'وقت حر';
      nowAct.style.color = '#94a3b8';
      nowRem.textContent = '';
      nowRem.style.color = 'var(--text-muted)';
      dot.style.background = '#94a3b8';
      dot.classList.remove('animate-pulse');
      badge.textContent = 'جاهز';
      badge.style.cssText = 'background:rgba(148,163,184,.1);color:#b8c2d4;border:1px solid var(--border)';
    }
  }

  if(activeDay === ti && now.getSeconds() === 0) renderDay();
}

/* =========================================================
   NOTIFICATIONS
   ========================================================= */
let notifEnabled = false;
async function enableNotifications(){
  if(!('Notification' in window)){toast('الإشعارات غير مدعومة','danger');return;}
  const perm = await Notification.requestPermission();
  notifEnabled = perm==='granted';
  const btn = document.getElementById('btn-enable-notif');
  if(notifEnabled){
    btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span class="hidden sm:inline">مفعلة</span>`;
    btn.style.cssText='';
    btn.classList.add('notif-btn','enabled');
    new Notification('تم تفعيل الإشعارات',{body:'سنذكرك قبل 5 دقائق من كل نشاط.'});
    toast('تم تفعيل الإشعارات');
  } else toast('لم يتم منح الصلاحية','danger');
}
function checkNotifications(){
  if(!notifEnabled || Notification.permission!=='granted') return;
  const now = new Date();
  const sessions = getSessionsFor(now);
  const minNow = now.getHours()*60 + now.getMinutes();
  sessions.forEach((s,i)=>{
    const sM = timeToMinutes(s.start);
    const key = `${todayIndex()}-${i}-${now.toDateString()}`;
    if(minNow===sM-5 && !notified.has(key+'-w')){
      notified.add(key+'-w');
      new Notification('اقتراب نشاط',{body:`بعد 5 دقائق: ${s.title} (${s.start})`});
    }
    if(minNow===sM && !notified.has(key+'-s')){
      notified.add(key+'-s');
      new Notification('بدء النشاط',{body:`الآن: ${s.title} — ${s.start} إلى ${s.end}`});
    }
  });
}

/* =========================================================
   SESSION NOTE MODAL
   ========================================================= */
function openNoteModal(dayIdx, sessIdx, session){
  noteCtx = { dayIdx, sessIdx, mode:'view' };
  document.getElementById('modal-title').textContent = session.title;
  const theme = THEMES[session.theme];
  document.getElementById('modal-sub').innerHTML =
    `<span style="color:${theme.border}">${STORE.schedule[dayIdx].day}</span> • <span class="font-time">${session.start} - ${session.end}</span>`;
  document.getElementById('modal-icon-wrap').innerHTML = ICONS[session.icon];
  document.getElementById('modal-icon-wrap').style.background = theme.badge;
  document.getElementById('modal-icon-wrap').style.color = theme.border;
  setModalMode('view');
  document.getElementById('modal-note').classList.remove('hidden');
  document.getElementById('modal-note').classList.add('flex');
}
function closeNoteModal(){
  document.getElementById('modal-note').classList.add('hidden');
  document.getElementById('modal-note').classList.remove('flex');
  noteCtx = { dayIdx:null, sessIdx:null, mode:'view' };
}
function setModalMode(mode){
  noteCtx.mode = mode;
  const viewBox = document.getElementById('modal-view-mode');
  const editBox = document.getElementById('modal-edit-mode');
  const key = `${noteCtx.dayIdx}-${noteCtx.sessIdx}`;
  const current = STORE.notes[key] || '';
  if(mode==='view'){
    viewBox.classList.remove('hidden');
    editBox.classList.add('hidden');
    const display = document.getElementById('modal-note-display');
    const delBtn = document.getElementById('modal-delete-btn');
    const editLabel = document.getElementById('modal-edit-label');
    if(current){
      display.textContent = current;
      display.classList.remove('empty');
      editLabel.textContent = 'تعديل الملاحظة';
      delBtn.classList.remove('hidden');
    } else {
      display.textContent = 'لا توجد ملاحظة بعد — اضغط "إضافة" لكتابة واحدة.';
      display.classList.add('empty');
      editLabel.textContent = 'إضافة ملاحظة';
      delBtn.classList.add('hidden');
    }
  } else {
    viewBox.classList.add('hidden');
    editBox.classList.remove('hidden');
    const ta = document.getElementById('modal-textarea');
    ta.value = current;
    updateCharCount();
    setTimeout(()=>ta.focus(),40);
  }
}
function updateCharCount(){
  const ta = document.getElementById('modal-textarea');
  document.getElementById('modal-char-count').textContent = `${ta.value.length} / 1000`;
}
function saveSessionNote(){
  const val = document.getElementById('modal-textarea').value.trim();
  const key = `${noteCtx.dayIdx}-${noteCtx.sessIdx}`;
  if(val) STORE.notes[key] = val;
  else delete STORE.notes[key];
  saveStore(); setModalMode('view'); renderDay(); renderNav();
  toast('تم حفظ الملاحظة');
}
function deleteSessionNote(){
  const key = `${noteCtx.dayIdx}-${noteCtx.sessIdx}`;
  if(!STORE.notes[key]) return;
  if(!confirm('هل تريد حذف هذه الملاحظة؟')) return;
  delete STORE.notes[key];
  saveStore(); setModalMode('view'); renderDay(); renderNav();
  toast('تم حذف الملاحظة','info');
}

/* =========================================================
   EDIT VIEW — مع السحب والإفلات
   ========================================================= */
let editScope = 'permanent';
let editDayIdx = todayIndex();
let editSessions = [];

function loadEditSessions(){
  if (editScope === 'permanent'){
    editSessions = clone(STORE.schedule[editDayIdx].sessions);
  } else {
    const weekKey = getWeekKey(new Date());
    const ovr = STORE.overrides[weekKey]?.[editDayIdx];
    editSessions = clone(Array.isArray(ovr) ? ovr : STORE.schedule[editDayIdx].sessions);
  }
}

function renderEditView(){
  const sel = document.getElementById('edit-day-selector');
  sel.innerHTML = '';
  STORE.schedule.forEach((d,i)=>{
    const b = document.createElement('button');
    b.className = 'day-tab' + (editDayIdx===i?' active':'');
    b.textContent = d.day;
    b.onclick = ()=>{
      editDayIdx = i;
      loadEditSessions();
      renderEditView();
    };
    sel.appendChild(b);
  });

  document.getElementById('edit-day-title').textContent = STORE.schedule[editDayIdx].day;
  const info = document.getElementById('edit-week-info');
  if (editScope === 'permanent'){
    info.textContent = 'التعديلات ستُطبق على كل الأسابيع القادمة';
    info.style.color = '#6ee7b7';
  } else {
    const ws = getWeekStart(new Date());
    info.textContent = `التعديلات ستُطبق على أسبوع ${formatDate(ws,{day:'numeric',month:'long'})} فقط`;
    info.style.color = '#fcd34d';
  }

  renderEditGrid();
}

/* ==== شبكة التعديل مع السحب والإفلات ==== */
function renderEditGrid(){
  const axis = document.getElementById('edit-time-axis');
  const canvas = document.getElementById('edit-canvas');
  axis.innerHTML = '';
  // Keep snap line and drag hint
  const snapLine = document.getElementById('snap-line');
  const dragHint = document.getElementById('drag-hint');
  canvas.innerHTML = '';
  canvas.appendChild(snapLine);
  canvas.appendChild(dragHint);
  canvas.style.height = TOTAL_HEIGHT + 'px';
  axis.style.height = TOTAL_HEIGHT + 'px';

  // الساعات على المحور
  for (let hour = 5; hour <= 21; hour++){
    const topPx = (hour - START_HOUR) * HOUR_HEIGHT;
    const marker = document.createElement('div');
    marker.className = 'mark';
    marker.style.top = topPx + 'px';
    marker.innerHTML = `<span class="time-label" style="font-size:10.5px;padding:2px 7px">${pad(hour)}:00</span>`;
    axis.appendChild(marker);

    const line = document.createElement('div');
    line.style.cssText = `position:absolute;left:0;right:0;top:${topPx}px;border-top:1px solid rgba(148,163,184,.09);pointer-events:none`;
    canvas.appendChild(line);
  }

  // الجلسات
  editSessions.forEach((s, i)=>{
    const sMin = timeToMinutes(s.start), eMin = timeToMinutes(s.end);
    const dur = eMin - sMin;
    const topPx = ((sMin - START_HOUR*60)/60) * HOUR_HEIGHT;
    const hPx = Math.max((dur/60)*HOUR_HEIGHT - 3, 24);
    const theme = THEMES[s.theme];

    const el = document.createElement('div');
    el.className = 'edit-session';
    el.style.cssText = `top:${topPx+1.5}px;height:${hPx}px;background:${theme.bg};border:1.5px solid ${theme.border};border-right:5px solid ${theme.border}`;
    el.dataset.idx = i;

    el.innerHTML = `
      <div class="sess-delete" title="حذف">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <div class="sess-title">
        <span class="sess-icon" style="color:${theme.border}">${ICONS[s.icon]}</span>
        ${s.title}
      </div>
      ${hPx > 42 ? `<div class="sess-time">${s.start} — ${s.end}</div>` : ''}
      <div class="handle-resize" title="اسحب لتغيير المدة"></div>
    `;
    // ضبط حجم أيقونة الجلسة
    const iconSvg = el.querySelector('.sess-icon svg');
    if (iconSvg){ iconSvg.style.width = '13px'; iconSvg.style.height = '13px'; }

    // زر الحذف
    el.querySelector('.sess-delete').onclick = (ev)=>{
      ev.stopPropagation();
      if (!confirm(`حذف "${s.title}"؟`)) return;
      editSessions.splice(i, 1);
      renderEditGrid();
    };

    // السحب / تغيير الحجم
    makeSessionInteractive(el, i, 'move');
    const handle = el.querySelector('.handle-resize');
    makeSessionInteractive(handle, i, 'resize');

    canvas.appendChild(el);
  });
}

/* ==== منطق السحب — Move & Resize مع Snap إلى 15 دقيقة ==== */
function makeSessionInteractive(el, idx, mode){
  let startY = 0, startTop = 0, startHeight = 0, startMinutes = 0, startDur = 0;
  let moved = false;

  function onDown(e){
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const pe = e.touches ? e.touches[0] : e;
    startY = pe.clientY;
    const s = editSessions[idx];
    startMinutes = timeToMinutes(s.start);
    startDur = timeToMinutes(s.end) - startMinutes;
    const rect = el.getBoundingClientRect();
    startTop = rect.top;
    startHeight = rect.height;
    moved = false;
    el.classList.add(mode === 'move' ? 'dragging' : 'resizing');
    showDragHint(el, mode);

    const onMove = (ev)=>{
      const pe2 = ev.touches ? ev.touches[0] : ev;
      const dy = pe2.clientY - startY;
      if (Math.abs(dy) > 2) moved = true;
      const dyMin = (dy / HOUR_HEIGHT) * 60;
      const snappedDyMin = Math.round(dyMin / 15) * 15;
      const snapLine = document.getElementById('snap-line');
      const hint = document.getElementById('drag-hint');

      if (mode === 'move'){
        let newStart = startMinutes + snappedDyMin;
        newStart = Math.max(START_HOUR*60, Math.min(END_HOUR*60 - startDur, newStart));
        const newEnd = newStart + startDur;
        editSessions[idx].start = minutesToTime(newStart);
        editSessions[idx].end = minutesToTime(newEnd);
        const topPx = ((newStart - START_HOUR*60)/60) * HOUR_HEIGHT;
        el.style.top = (topPx + 1.5) + 'px';
        snapLine.style.top = topPx + 'px';
        snapLine.classList.add('show');
        if (hint) hint.textContent = `${minutesToTime(newStart)} — ${minutesToTime(newEnd)}`;
        const timeEl = el.querySelector('.sess-time');
        if (timeEl) timeEl.textContent = `${minutesToTime(newStart)} — ${minutesToTime(newEnd)}`;
      } else {
        let newDur = startDur + snappedDyMin;
        newDur = Math.max(15, Math.min(END_HOUR*60 - startMinutes, newDur));
        const newEnd = startMinutes + newDur;
        editSessions[idx].end = minutesToTime(newEnd);
        const hPx = Math.max((newDur/60)*HOUR_HEIGHT - 3, 24);
        el.style.height = hPx + 'px';
        const bottomTop = ((newEnd - START_HOUR*60)/60) * HOUR_HEIGHT;
        snapLine.style.top = bottomTop + 'px';
        snapLine.classList.add('show');
        if (hint) hint.textContent = `${minutesToTime(startMinutes)} — ${minutesToTime(newEnd)}`;
        const timeEl = el.querySelector('.sess-time');
        if (timeEl) timeEl.textContent = `${minutesToTime(startMinutes)} — ${minutesToTime(newEnd)}`;
        else if (hPx > 42){
          const div = document.createElement('div');
          div.className = 'sess-time';
          div.textContent = `${minutesToTime(startMinutes)} — ${minutesToTime(newEnd)}`;
          el.insertBefore(div, el.querySelector('.handle-resize'));
        }
      }
    };

    const onUp = ()=>{
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      el.classList.remove('dragging', 'resizing');
      document.getElementById('snap-line').classList.remove('show');
      hideDragHint();
      if (moved) toast(`تم تحديث: ${editSessions[idx].start} → ${editSessions[idx].end}`, 'info');
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }

  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onDown, { passive: false });
}

function showDragHint(el, mode){
  const hint = document.getElementById('drag-hint');
  if (!hint) return;
  hint.classList.add('show');
  hint.textContent = editSessions[el.dataset.idx]
    ? `${editSessions[el.dataset.idx].start} — ${editSessions[el.dataset.idx].end}`
    : '';
}
function hideDragHint(){
  const hint = document.getElementById('drag-hint');
  if (hint) hint.classList.remove('show');
}

function saveEdit(){
  for (const s of editSessions){
    const st = timeToMinutes(s.start), en = timeToMinutes(s.end);
    if (!s.title || !s.title.trim()){ toast('اكتب اسمًا لكل نشاط','danger'); return; }
    if (!Number.isFinite(st) || !Number.isFinite(en) || st < START_HOUR*60 || en > END_HOUR*60 || en <= st){
      toast('تحقق من الوقت: النهاية بعد البداية وبين 04:30 و21:00','danger'); return;
    }
    s.title = s.title.trim();
  }
  if (editScope === 'permanent'){
    STORE.schedule[editDayIdx].sessions = clone(editSessions);
    saveStore();
    toast('تم حفظ التعديلات الدائمة');
  } else {
    const weekKey = getWeekKey(new Date());
    if (!STORE.overrides[weekKey]) STORE.overrides[weekKey] = {};
    STORE.overrides[weekKey][editDayIdx] = clone(editSessions);
    saveStore();
    toast('تم حفظ تعديل هذا الأسبوع');
  }
  renderDay(); renderNav();
  if (activeView === 'week') renderWeekView();
  loadEditSessions(); renderEditView();
}

/* ==== إضافة نشاط جديد ==== */
function addNewSession(){
  // البحث عن فجوة فارغة
  const sorted = editSessions.slice().sort((a,b)=> timeToMinutes(a.start) - timeToMinutes(b.start));
  let newStart = 8*60, newEnd = 9*60;
  for (let m = START_HOUR*60; m <= END_HOUR*60 - 60; m += 30){
    const conflict = sorted.some(s => {
      const sM = timeToMinutes(s.start), eM = timeToMinutes(s.end);
      return !(m + 60 <= sM || m >= eM);
    });
    if (!conflict){ newStart = m; newEnd = m + 60; break; }
  }
  editSessions.push({
    start: minutesToTime(newStart),
    end: minutesToTime(newEnd),
    title: 'نشاط جديد',
    icon: 'book',
    theme: 'regional'
  });
  renderEditGrid();
  // التمرير إلى النشاط الجديد + رسالة
  setTimeout(()=>{
    const last = document.querySelector('.edit-session:last-of-type');
    if (last) last.scrollIntoView({ behavior:'smooth', block:'center' });
    toast('تمت إضافة نشاط جديد — اسحبه للمكان المناسب', 'info');
  }, 100);
}

/* =========================================================
   VIEW SWITCHER
   ========================================================= */
function switchView(v){
  activeView = v;
  ['day','week','edit'].forEach(name=>{
    document.getElementById('view-'+name).classList.toggle('hidden', name !== v);
  });
  document.querySelectorAll('.view-tab').forEach(b=>{
    const isActive = b.dataset.view === v;
    b.classList.toggle('active', isActive);
    b.style.cssText = isActive
      ? 'background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;box-shadow:0 4px 16px -4px rgba(99,102,241,.5)'
      : '';
  });
  if (v === 'day') renderDay();
  if (v === 'week') renderWeekView();
  if (v === 'edit'){ loadEditSessions(); renderEditView(); }
}

/* =========================================================
   INIT
   ========================================================= */
document.addEventListener('DOMContentLoaded', ()=>{
  const sel = document.getElementById('mobile-day-select');
  STORE.schedule.forEach((d,i)=>{
    const o = document.createElement('option');
    o.value = i; o.textContent = d.day; sel.appendChild(o);
  });
  sel.addEventListener('change', e=>{ activeDay=+e.target.value; renderDay(); renderNav(); });

  document.getElementById('day-note-edit-btn').onclick = startDayNoteEdit;
  document.getElementById('day-note-add-btn').onclick = startDayNoteEdit;
  document.getElementById('day-note-save').onclick = saveDayNote;
  document.getElementById('day-note-cancel').onclick = cancelDayNote;

  document.getElementById('modal-edit-btn').onclick = ()=> setModalMode('edit');
  document.getElementById('modal-cancel-btn').onclick = ()=> setModalMode('view');
  document.getElementById('modal-save-btn').onclick = saveSessionNote;
  document.getElementById('modal-delete-btn').onclick = deleteSessionNote;
  document.getElementById('modal-textarea').addEventListener('input', updateCharCount);
  document.getElementById('modal-note').addEventListener('click', e=>{
    if(e.target.id==='modal-note') closeNoteModal();
  });

  document.getElementById('btn-enable-notif').onclick = enableNotifications;

  document.getElementById('btn-sound').onclick = ()=>{
    soundEnabled = !soundEnabled;
    ensureAudio();
    document.getElementById('sound-label').textContent = soundEnabled ? 'الأصوات' : 'صامت';
    document.getElementById('btn-sound').style.cssText = soundEnabled ? '' : 'background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)';
    toast(soundEnabled ? 'تم تفعيل الأصوات' : 'تم كتم الأصوات', soundEnabled ? 'success' : 'info');
    if (soundEnabled) playStartSound();
  };

  document.getElementById('week-prev').onclick = ()=>{ weekViewDate = addDays(weekViewDate, -7); renderWeekView(); };
  document.getElementById('week-next').onclick = ()=>{ weekViewDate = addDays(weekViewDate, 7); renderWeekView(); };
  document.getElementById('week-today').onclick = ()=>{ weekViewDate = new Date(); renderWeekView(); };

  document.querySelectorAll('.scope-btn').forEach(b=>{
    b.onclick = ()=>{
      editScope = b.dataset.scope;
      document.querySelectorAll('.scope-btn').forEach(x=>x.classList.toggle('active', x.dataset.scope === editScope));
      loadEditSessions();
      renderEditView();
    };
  });
  document.getElementById('add-session-btn').onclick = addNewSession;
  document.getElementById('save-edit-btn').onclick = saveEdit;
  document.getElementById('reset-edit-btn').onclick = ()=>{
    if (!confirm('التراجع عن التعديلات غير المحفوظة؟')) return;
    loadEditSessions();
    renderEditGrid();
  };

  document.querySelectorAll('.view-tab').forEach(b=>{
    b.onclick = ()=> switchView(b.dataset.view);
  });

  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      if(!document.getElementById('modal-note').classList.contains('hidden')) closeNoteModal();
      if(dayNoteEditing) cancelDayNote();
    }
  });

  renderNav();
  renderDay();
  syncMobileSelect();
  switchView('day');
  updateNow();
  setInterval(updateNow, 1000);
  setInterval(checkNotifications, 15000);

  document.addEventListener('click', ()=> ensureAudio(), { once: true });
});
</script>
